<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PQChat v2.0 - Secure Post-Quantum Messaging</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>PQChat</h1>
                <p style="color: var(--text-secondary)">Secure Post-Quantum Messaging</p>
            </div>
            
            <form id="authForm" class="login-form">
                <input type="text" id="username" placeholder="Username" required autofocus autocomplete="off">
                <input type="password" id="password" placeholder="Password" required>
                <div id="errorMsg" class="error-msg"></div>
                <button type="submit" id="submitBtn">Login</button>
            </form>

            <div class="toggle-mode">
                <span id="modeText">Don't have an account?</span>
                <a id="toggleBtn">Register here</a>
            </div>
        </div>
    </div>

    <script>
        let isLoginMode = true;
        
        const authForm = document.getElementById("authForm");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const submitBtn = document.getElementById("submitBtn");
        const toggleBtn = document.getElementById("toggleBtn");
        const modeText = document.getElementById("modeText");
        const errorMsg = document.getElementById("errorMsg");

        toggleBtn.addEventListener("click", () => {
            isLoginMode = !isLoginMode;
            if (isLoginMode) {
                submitBtn.textContent = "Login";
                modeText.textContent = "Don't have an account?";
                toggleBtn.textContent = "Register here";
            } else {
                submitBtn.textContent = "Register";
                modeText.textContent = "Already have an account?";
                toggleBtn.textContent = "Login here";
            }
            errorMsg.textContent = "";
        });

        authForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            if (!username || !password) return;

            errorMsg.textContent = "";
            submitBtn.disabled = true;

            const endpoint = isLoginMode ? "/api/login" : "/api/register";
            
            try {
                const res = await fetch(endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await res.json();
                
                if (data.ok) {
                    if (isLoginMode) {
                        sessionStorage.setItem("pqchat_token", data.token);
                        sessionStorage.setItem("pqchat_username", data.username);
                        window.location.href = "/chat";
                    } else {
                        // Registration success, switch to login
                        isLoginMode = true;
                        submitBtn.textContent = "Login";
                        modeText.textContent = "Don't have an account?";
                        toggleBtn.textContent = "Register here";
                        errorMsg.style.color = "var(--accent-success)";
                        errorMsg.textContent = "Registration successful! Please login.";
                        setTimeout(() => { errorMsg.style.color = "var(--accent-danger)"; errorMsg.textContent = ""; }, 3000);
                        passwordInput.value = "";
                    }
                } else {
                    errorMsg.style.color = "var(--accent-danger)";
                    errorMsg.textContent = data.error || "An error occurred";
                }
            } catch (err) {
                errorMsg.style.color = "var(--accent-danger)";
                errorMsg.textContent = "Network error. Please try again.";
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
