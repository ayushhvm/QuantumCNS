<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PQ Messenger</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <h1 id="login-title">PQ Messenger</h1>
      <p class="subtitle">Post-Quantum Secure</p>

      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" placeholder="alice or bob">

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="Enter password">

      <button id="login-btn" type="button" onclick="loginUser()">Log In Securely</button>

      <p id="login-error" class="login-error" hidden>Invalid username or password</p>
      <p class="login-hint">Try alice/alice123 or bob/bob123</p>
    </section>
  </main>

  <script>
    async function loginUser() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const error = document.getElementById('login-error');
      const button = document.getElementById('login-btn');

      error.hidden = true;
      button.disabled = true;

      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });

        if (!response.ok) {
          error.hidden = false;
          return;
        }

        const data = await response.json();
        sessionStorage.setItem('pq_token', data.token);
        sessionStorage.setItem('pq_username', data.username);
        window.location.href = '/chat?token=' + encodeURIComponent(data.token);
      } catch (_err) {
        error.hidden = false;
      } finally {
        button.disabled = false;
      }
    }

    document.addEventListener('keydown', function onKeyDown(event) {
      if (event.key === 'Enter') {
        loginUser();
      }
    });
  </script>
</body>
</html>
