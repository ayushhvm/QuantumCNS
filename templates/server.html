<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Intercept - QuantumCNS</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body {
            background-color: #0d1117;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #00ff00;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        h1 {
            margin: 0;
            font-size: 1.5rem;
            text-transform: uppercase;
        }
        .btn-attack {
            background: rgba(255, 0, 0, 0.2);
            color: #ff4444;
            border: 1px solid #ff4444;
            padding: 10px 20px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        .btn-attack:hover:not(:disabled) {
            background: #ff4444;
            color: #000;
        }
        .btn-attack:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .terminal {
            flex: 1;
            overflow-y: auto;
            background: #000;
            padding: 15px;
            border: 1px solid #333;
            border-radius: 4px;
        }
        .log-entry {
            margin-bottom: 15px;
            word-wrap: break-word;
        }
        .log-time {
            color: #888;
        }
        .log-type {
            color: #ffaa00;
            font-weight: bold;
        }
        .log-data {
            color: #ccc;
            margin-left: 20px;
            white-space: pre-wrap;
        }
        .attack-panel {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border: 1px solid #ff4444;
            background: rgba(255, 0, 0, 0.05);
        }
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #222;
            margin-top: 10px;
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #ff4444;
            width: 0%;
            transition: width 0.1s linear;
        }
        .attack-status {
            margin-top: 10px;
            color: #ff4444;
        }
        .success-text {
            color: #00ff00;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Global Network Intercept Terminal</h1>
        <button id="attackBtn" class="btn-attack">Run Shor's Algorithm (Quantum Attack)</button>
    </div>

    <div class="terminal" id="terminal">
        <div class="log-entry">
            <span class="log-time">[SYSTEM]</span> Listening for traffic on port 5000...
        </div>
    </div>

    <div class="attack-panel" id="attackPanel">
        <h3 style="margin-top: 0; color: #ff4444;">SHOR'S ALGORITHM SIMULATOR</h3>
        <div id="attackTarget">Target: Intercepted Session Key</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="attack-status" id="attackStatus">Initializing Qubits...</div>
    </div>

    <script src="/static/js/server_view.js"></script>
</body>
</html>
