<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PQChat v2.0 - Chat</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <div class="app-container">
        
        <!-- Panel 1: Contacts -->
        <div class="panel-contacts">
            <div class="panel-header">
                <div class="user-profile">
                    <span class="status-indicator online"></span>
                    <span id="myUsername">Me</span>
                </div>
                <button id="logoutBtn" class="btn-logout" title="Logout">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                </button>
            </div>
            <div style="padding: 0.75rem; color: var(--text-secondary); font-size: 0.875rem; border-bottom: 1px solid var(--border-color);">Online Users</div>
            <div class="contacts-list" id="contactsList">
                <!-- Contact items populated dynamically -->
            </div>
        </div>

        <!-- Panel 2: Chat Window -->
        <div class="panel-chat">
            <div id="securityAlert" class="security-alert"></div>
            
            <div class="chat-header">
                <div class="chat-peer-info" id="chatPeerInfo" style="display: none;">
                    <span class="status-indicator online"></span>
                    <h3 id="currentPeer">No one selected</h3>
                </div>
                <div id="e2eeBadge" class="e2ee-badge" style="display: none;">
                    🔐 End-to-End Encrypted
                </div>
                <div class="hacker-mode-toggle" style="margin-left: auto;">
                    <label style="display: flex; align-items: center; gap: 0.5rem; color: var(--accent-danger); font-weight: bold; cursor: pointer; background: rgba(239, 68, 68, 0.1); padding: 0.25rem 0.5rem; border-radius: 4px; border: 1px solid rgba(239, 68, 68, 0.3);">
                        <input type="checkbox" id="hackerModeSwitch" style="accent-color: var(--accent-danger);">
                        Hacker Mode
                    </label>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="system-msg">Select a contact to begin a secure session.</div>
            </div>

            <div class="chat-input-area">
                <form id="chatForm" class="chat-form">
                    <input type="text" id="messageInput" placeholder="Type a secure message..." disabled autocomplete="off">
                    <button type="submit" id="sendBtn" disabled>Send</button>
                </form>
            </div>
        </div>

        <!-- Panel 3: Crypto Terminal -->
        <div class="panel-crypto">
            <div class="crypto-header">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
                CRYPTO TERMINAL
            </div>
            
            <div class="crypto-stats">
                <div class="stat-row">
                    <span>Algorithm</span>
                    <span class="stat-val">ML-KEM-768 / ML-DSA-65</span>
                </div>
                <div class="stat-row">
                    <span>Session Key</span>
                    <span class="stat-val" id="sessionKeyStat">None</span>
                </div>
                <div class="stat-row">
                    <span>Ratchet Step</span>
                    <span class="stat-val" id="ratchetStepStat">0</span>
                </div>
            </div>

            <div class="crypto-logs" id="cryptoLogs">
                <!-- Live logs will appear here -->
            </div>

            <div class="fingerprint-section" id="fingerprintSection" style="display: none;">
                <div class="fingerprint-label">SESSION FINGERPRINT</div>
                <div class="fingerprint-value" id="fingerprintValue">XXXX XXXX XXXX XXXX</div>
                <button class="btn-verify" id="verifyBtn">MARK AS VERIFIED</button>
            </div>
        </div>

    </div>

    <!-- Main UI Script -->
    <script type="module" src="/static/js/ui.js"></script>
</body>
</html>
